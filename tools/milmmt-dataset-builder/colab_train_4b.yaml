# LlamaFactory LoRA SFT configuration for MiLMMT-46-4B-v1.0 (Colab Pro+ A100 40GB/80GB)
# Apply ONLY after 1B passes all 5 quantitative GGUF evaluation gates.

### Model
model_name_or_path: xiaomi-research/MiLMMT-46-4B-v1.0
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset (same dataset_info.json entries validated on 1B)
dataset: ironworks_sft_train
eval_dataset: ironworks_sft_val
template: empty
add_special_tokens: false
train_on_prompt: false
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### Output
output_dir: /content/drive/MyDrive/ironworks-milmmt/checkpoints/milmmt-4b-v1.0-glossary-sft
logging_steps: 20
save_strategy: steps
save_steps: 200
eval_strategy: steps
eval_steps: 200
plot_loss: true
overwrite_output_dir: true

### Training (pure bf16 + gradient checkpointing on A100, effective batch = 64)
per_device_train_batch_size: 4
gradient_accumulation_steps: 16
per_device_eval_batch_size: 4
gradient_checkpointing: true
learning_rate: 3.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
seed: 42
